<style>

<body>

let lang = 'tr';

// The example and the longest choice on one line in this device's own font: smaller only where they wouldn't fit.
function fitWords() {

  document.body.appendChild(probe);

    const cs = getComputedStyle(el), room = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2;
    probe.style.fontFamily = cs.fontFamily;

}
addEventListener('resize', () => fitWords());
const $ = id => document.getElementById(id);
let ran = false;
$('lang').onclick = () => { lang = lang === 'tr' ? 'en' : 'tr'; try { localStorage.setItem('sc-lang', lang); } catch (e) { /* none */ } words(); };
words();

// ---- the test recording: a quiet low tone all through (to find gaps), and short bright clicks at known times, at
// uneven distances so that a late sound can't be taken for the next one
const SR = 44100, LEN = 16, TONE = 220, TONE_AMP = 0.05;

const say = (s, warn) => { $('status').hidden = false; $('status').textContent = s; $('status').className = warn ? 'warn' : ''; };

const wait = ms => new Promise(r => setTimeout(r, ms));
const ms = x => (x === null || x === undefined || !isFinite(x) ? '–' : Math.round(x * 1000) + ' ms');

}

  v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.max(-32767, Math.min(32767, Math.round(d[i] * 32767))), true);

// (MP3 too, as Provarium's recordings mostly are: lamejs, beside this page, with its licence)
function mp3Blob(d) {

  const enc = new lamejs.Mp3Encoder(1, SR, 128), n = d.length, i16 = new Int16Array(n), parts = [];

function element(url) {

// (On the tap itself: each element started and stopped at once, so it may start later without another tap, as
// Provarium does. An iPhone refuses a sound started later otherwise.)
function unlock(els) { for (const a of els) { try { const p = a.play(); a.pause(); if (p && p.catch) p.catch(() => null); } catch (e) { /* none */ } } }
const loaded = (els, t) => Promise.race([Promise.all(els.map(a => (a.readyState >= 3 ? 1 : new Promise(ok => { a.addEventListener('canplaythrough', ok, { once: true }); a.addEventListener('error', ok, { once: true }); })))), wait(t)]);

// ---- listening to what reaches the sound's graph: each element on a channel of its own; the last channel hears clicks
// made on the sound's own clock, to find how late this listener itself hears (taken off every measure)
let ctx = null;
function capture(chs) {
  const sp = ctx.createScriptProcessor(256, chs, 1), merger = ctx.createChannelMerger(chs), st = { on: [], low: [], blocks: 0 };
  for (let c = 0; c < chs; c++) { st.on.push([]); st.low.push([]); }
  const last = new Array(chs).fill(-1);
  sp.onaudioprocess = ev => {
    st.blocks++;
    let t0 = ev.playbackTime; if (!(t0 > 0)) t0 = ctx.currentTime;
    const ib = ev.inputBuffer, n = ib.length, sr = ib.sampleRate;
    for (let c = 0; c < chs; c++) {
      const x = ib.getChannelData(c); let ss = 0, hot = false;

// The page's clock against each element's, sampled as often as the page allows.
function sampler(els) {
  const pts = []; let on = true;
  const take = () => { if (on) pts.push([ctx.currentTime, performance.now() / 1000].concat(els.map(a => a.currentTime))); };
  const iv = setInterval(take, 4), raf = () => { take(); if (on) requestAnimationFrame(raf); }; requestAnimationFrame(raf);

// Where on the page's clock media time m was, fitted on one element's points in [c0, c1].
function fit(pts, k, c0, c1) {
  const P = pts.filter(p => p[0] >= c0 && p[0] <= c1 && p[2 + k] > 0.05);

// How late the clicks were heard after the page's clock put them: the shift that lines up the most, then the middle of

function lateness(onsets, at, c0, c1) {

// Four parts through the sound's graph, as Ayrık Partiler, MuseScore and MusicXML play: how late each is heard after

// then at speed 0.75. Quiet: the same at speed 1 with nothing let out to the speaker (if it measures the same, a device
// can be measured without being heard).
async function routed(label, els, f0, f1, quiet) {

  const N = els.length;
  await loaded(els, 8000);
  const cap = capture(N + 1), out = ctx.createGain(); out.gain.value = quiet ? 0 : 0.35; out.connect(ctx.destination);
  els.forEach((a, k) => { const s = ctx.createMediaElementSource(a); s.connect(out); s.connect(cap.merger, 0, k); });
  const cal = [], c0 = ctx.currentTime + 0.25;
  for (let j = 0; j < 6; j++) { const t = c0 + j * 0.37, o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 2000; g.gain.setValueAtTime(0, 0); g.gain.setValueAtTime(0.8, t); g.gain.linearRampToValueAtTime(0, t + 0.006); o.connect(g); g.connect(cap.merger, 0, N); o.start(t); o.stop(t + 0.02); cal.push(t); }
  await wait(2600);

  const smp = sampler(els);

  const callC = ctx.currentTime;
  const res = await Promise.all(els.map(a => a.play().then(() => 'ok', e => (e && e.name) || 'refused')));
  const playedC = ctx.currentTime;

  const seekC = ctx.currentTime;
  if (!quiet) els[1].currentTime = els[0].currentTime;
  if (!quiet) { await wait(3200); prog(f0 + (f1 - f0) * 0.55); }
  const rateC = ctx.currentTime;
  if (!quiet) { els.forEach(a => { a.playbackRate = 0.75; }); await wait(6500); }
  prog(f1);
  const endC = ctx.currentTime;
  els.forEach(a => a.pause()); smp.stop(); await wait(300);
  cap.sp.disconnect(); out.disconnect();
  const O = isFinite(own) ? own : 0, on = cap.st.on.map(a => a.map(t => t - O)), low = cap.st.low.map(a => a.map(x => [x[0] - O, x[1], x[2]]));
  const first = on[0][0], startLate = first !== undefined ? first - callC - CLICKS[0] : NaN;
  const r1 = els.map((a, k) => { const at = fit(smp.pts, k, playedC + 0.4, seekC - 0.05); return at ? lateness(on[k], at, playedC + 0.4, seekC - 0.05) : null; });
  const after = quiet ? null : (() => { const at = fit(smp.pts, 1, seekC + 0.8, rateC - 0.05); return at ? lateness(on[1], at, seekC + 0.8, rateC - 0.05) : null; })();
  const r2 = quiet ? [] : els.map((a, k) => { const at = fit(smp.pts, k, rateC + 0.8, endC - 0.1); return at ? lateness(on[k], at, rateC + 0.8, endC - 0.1) : null; });
