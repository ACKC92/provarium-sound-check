    lines.push('Phone: ' + ($('model').value.trim() || '(not given)') + ' · listening on: ' + $('route').value);
    lines.push('Browser: ' + navigator.userAgent);
    lines.push('Sound: ' + ctx.sampleRate + ' Hz · base ' + ms(ctx.baseLatency) + ' · out ' + ms(ctx.outputLatency) + ' · output timestamps ' + (ctx.getOutputTimestamp ? 'yes' : 'no') + ' · audio session ' + (navigator.audioSession ? navigator.audioSession.type : 'none') + ' · state ' + ctx.state);
    await plain('Plain', solo); prog(0.06);
    await routed('WAV', wavEls, 0.06, 0.5);
    await routed('MP3', mp3Els, 0.5, 0.97);
    prog(1); say(W('done'));
  } catch (e) { lines.push('Stopped: ' + (e && e.message || e)); say(W('stopped') + (e && e.message || e), true); }
  ran = true;
  $('out').textContent = lines.join('\n'); $('out').hidden = false; $('copy').hidden = false; $('share').hidden = !navigator.share; $('bg').hidden = false; $('bgnote').hidden = false;
  $('go').disabled = false; $('go').textContent = W('again');
}
$('copy').onclick = async () => {
  const txt = $('out').textContent;
  try { await navigator.clipboard.writeText(txt); say(W('copied')); }
  catch (e) { const r = document.createRange(); r.selectNodeContents($('out')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); say(W('selected')); }
};
$('share').onclick = async () => { try { await navigator.share({ text: $('out').textContent }); } catch (e) { /* closed */ } };
// ---- out of sight: does the page keep time (timers, frames, the sound) while another app is in front?
$('bg').onclick = () => {
  $('bg').disabled = true;
  const url = URL.createObjectURL(wavBlob(pcm())), a = element(url); a.loop = true;
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  const cap = capture(1), s = ctx.createMediaElementSource(a), g = ctx.createGain(); g.gain.value = 0.35; s.connect(g).connect(ctx.destination); s.connect(cap.merger, 0, 0);
  const played = a.play();
  away(url, a, cap, g, played);
};
async function away(url, a, cap, g, played) {
  const st = { hidAt: 0, backAt: 0, ticks: 0, frames: 0, states: new Set(), paused: false, blocksAt: 0, blocksBack: 0 };
  const iv = setInterval(() => { if (document.hidden) { st.ticks++; st.states.add(ctx.state); if (a.paused) st.paused = true; } }, 100);
  const raf = () => { if (document.hidden) st.frames++; if (!st.backAt) requestAnimationFrame(raf); }; requestAnimationFrame(raf);
  const vis = () => { if (document.hidden && !st.hidAt) { st.hidAt = performance.now(); st.blocksAt = cap.st.blocks; } else if (!document.hidden && st.hidAt && !st.backAt) { st.backAt = performance.now(); st.blocksBack = cap.st.blocks; } };
  document.addEventListener('visibilitychange', vis);
  await played.catch(e => e);
  say(W('bgNow'));
  const until = performance.now() + 120000;
  while (!st.backAt && performance.now() < until) await wait(200);
  await wait(500);
  clearInterval(iv); document.removeEventListener('visibilitychange', vis); a.pause(); cap.sp.disconnect(); g.disconnect(); URL.revokeObjectURL(url);
  if (!st.backAt) lines.push('Out of sight: the page was never left');
  else {
    const sec = (st.backAt - st.hidAt) / 1000, heard = (st.blocksBack - st.blocksAt) * 256 / ctx.sampleRate;
    lines.push('Out of sight for ' + sec.toFixed(1) + ' s: timers ' + (st.ticks / sec).toFixed(1) + '/s (10 when not slowed) · frames ' + st.frames + ' · sound’s state ' + ([...st.states].join(', ') || '–') + ' · recording ' + (st.paused ? 'paused by the phone' : 'went on') + ' · the sound’s graph ran ' + heard.toFixed(1) + ' s of it');
  }
  $('out').textContent = lines.join('\n'); $('out').hidden = false; $('copy').hidden = false; $('share').hidden = !navigator.share;
  $('bg').disabled = false; say(W('done'));
}
</script>
